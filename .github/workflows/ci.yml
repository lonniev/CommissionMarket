name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # The site, built the way production builds it. Green has to mean it still builds.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
        env:
          VITE_MCP_URL: /mcp
